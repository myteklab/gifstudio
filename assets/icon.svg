<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6c5ce7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a29bfe;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="film" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#e0e0e0;stop-opacity:0.9" />
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="128" cy="128" r="120" fill="url(#bg)"/>

  <!-- Film strip -->
  <g id="filmstrip">
    <!-- Film frame -->
    <rect x="60" y="80" width="136" height="96" rx="8" fill="url(#film)"/>

    <!-- Sprocket holes (left) -->
    <rect x="68" y="90" width="12" height="10" rx="2" fill="#6c5ce7"/>
    <rect x="68" y="110" width="12" height="10" rx="2" fill="#6c5ce7"/>
    <rect x="68" y="130" width="12" height="10" rx="2" fill="#6c5ce7"/>
    <rect x="68" y="150" width="12" height="10" rx="2" fill="#6c5ce7"/>

    <!-- Sprocket holes (right) -->
    <rect x="176" y="90" width="12" height="10" rx="2" fill="#6c5ce7"/>
    <rect x="176" y="110" width="12" height="10" rx="2" fill="#6c5ce7"/>
    <rect x="176" y="130" width="12" height="10" rx="2" fill="#6c5ce7"/>
    <rect x="176" y="150" width="12" height="10" rx="2" fill="#6c5ce7"/>

    <!-- Frame dividers -->
    <line x1="110" y1="85" x2="110" y2="171" stroke="#6c5ce7" stroke-width="2"/>
    <line x1="146" y1="85" x2="146" y2="171" stroke="#6c5ce7" stroke-width="2"/>

    <!-- Play symbol -->
    <path d="M 120 118 L 120 138 L 135 128 Z" fill="#6c5ce7" opacity="0.7"/>
  </g>

  <!-- GIF text -->
  <text x="128" y="210" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="#ffffff" text-anchor="middle">GIF</text>
</svg>
